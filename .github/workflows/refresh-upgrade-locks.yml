name: refresh-upgrade-locks

on:
  push:
    branches:
      - upgrade/lazy-ui-2-docs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Refresh Composer lock
        run: composer update --with-all-dependencies --no-interaction --prefer-dist

      - name: Refresh npm lock
        run: npm install --package-lock-only

      - name: Commit refreshed locks
        run: |
          if git diff --quiet -- composer.lock package-lock.json; then
            echo "Lock files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          git commit -m "Refresh dependency locks for Lazy UI 2 docs"
          git push
